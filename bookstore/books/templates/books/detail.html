<!DOCTYPE html>
<html>
<head><title>{{ book.title }}</title></head>
<body>
  <h1>{{ book.title }}</h1>
  <p><strong>Description:</strong> {{ book.description }}</p>
  <p><strong>Rating:</strong> ⭐ {{ book.rate }} / 5</p>
  <p><strong>Views:</strong> 👁️ {{ book.views }}</p>
  <br>
  <a href="{% url 'book_edit' book.pk %}">✏️ Edit</a> |
  <a href="{% url 'book_delete' book.pk %}">🗑️ Delete</a> |
  <a href="{% url 'book_list' %}">← Back to List</a>
</body>
</html>
