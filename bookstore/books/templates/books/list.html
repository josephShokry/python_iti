<!DOCTYPE html>
<html>
<head><title>Bookstore</title></head>
<body>
  <h1>📚 All Books</h1>
  <a href="{% url 'book_create' %}">+ Add New Book</a>
  <hr>
  {% for book in books %}
    <div>
      <h3><a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a></h3>
      <p>⭐ {{ book.rate }} &nbsp;|&nbsp; 👁️ {{ book.views }} views</p>
    </div>
  {% empty %}
    <p>No books yet.</p>
  {% endfor %}
</body>
</html>
